name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing via Sigstore OIDC (SEC-02)
      packages: write # push the container image to GHCR
    env:
      # Optional channels publish only when their secrets are configured (mirrors the
      # homebrew skip pattern), so a fork or a not-yet-configured repo still releases
      # the binaries + the GHCR image.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_NPM: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'

      - name: Run tests
        run: go test -v -race ./...

      # HELD AT v3 DELIBERATELY -- do not merge a v4 bump on its own.
      # cosign-installer v4 installs Cosign v3, and Cosign v3 requires `--bundle`
      # on `sign-blob`. .goreleaser.yml signs the checksum file with
      # `sign-blob --output-signature --output-certificate`, so the installer bump
      # alone breaks signing -- and only on a tag push, which no PR check exercises.
      # Moving to v4 means migrating that block to bundles and accepting that
      # releases publish a .bundle instead of the .sig/.pem pair people verify today.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Set up QEMU (arm64 docker builds)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Release the tag that triggered this run. Without this GoReleaser derives the
          # version from `git describe`, which picks an arbitrary one when several tags
          # share a commit (e.g. v1.2.3-rc.1 promoted to v1.2.3) and then tries to upload
          # assets into the wrong, already-populated release.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Set (possibly empty) so the goreleaser skip_push template can read it —
          # Docker Hub images are pushed only when this is non-empty.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node (npm registry)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The main package pins its optionalDependencies to exact versions, so all seven
      # packages ship together: platform packages first, @qualflare/cli last.
      - name: Publish npm packages (@qualflare/cli + platform binaries)
        if: ${{ env.HAS_NPM == 'true' && !contains(github.ref_name, '-') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-npm-packages.mjs "$VERSION"
          scripts/publish-npm-packages.sh "$VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
