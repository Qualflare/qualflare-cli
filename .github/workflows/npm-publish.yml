name: Publish npm

# Standalone publisher for the @qualflare/cli wrapper. The tag release workflow
# publishes npm automatically; this exists to backfill or retry a single version
# (e.g. after an NPM_TOKEN fix) without re-running goreleaser, which errors on an
# already-published release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, without the leading v (e.g. 0.1.10)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm-publish:
    name: Publish @qualflare/cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestations via Sigstore OIDC
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "invalid version: '$VERSION' (expected semver like 0.1.10 or 0.1.10-rc.1)" >&2
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'

      - name: Set up Node (npm registry)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # `build`, not `release` — it produces dist/artifacts.json with the same ldflags
      # and targets as a real release, without touching the GitHub release or GHCR.
      - name: Build release binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.15.4
          args: build --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reason as release.yml: pin the version rather than letting
          # `git describe` choose between tags that share a commit.
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/build-npm-packages.mjs "$VERSION"
          scripts/publish-npm-packages.sh "$VERSION"
