name: Qodana

# JetBrains Qodana static analysis, reporting to qodana.cloud. Runs alongside
# golangci-lint (fast, in-CI, gating) and SonarCloud rather than replacing either —
# Qodana's inspections come from the GoLand engine, so it sees a different class of
# issue. The linter version is pinned in qodana.yaml and must track the action version
# below.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    # Skipped whenever QODANA_TOKEN is unreachable, because the scan then fails for
    # reasons the author cannot fix. Mirrors the HAS_NPM / HAS_SONAR pattern used in
    # the other workflows. Two cases:
    #
    #   - A pull request from a fork cannot read repository secrets.
    #   - A Dependabot pull request reads the *Dependabot* secret store, not the
    #     Actions one, so `secrets.QODANA_TOKEN` arrives empty and the linter exits 1
    #     with "please ensure you have an access token". It is not a fork, so the
    #     fork check alone did not catch it.
    #
    # To scan Dependabot PRs instead of skipping them, add QODANA_TOKEN under
    # Settings > Secrets and variables > Dependabot and drop the actor check.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    permissions:
      contents: read
      pull-requests: write # post the summary comment on a PR
      checks: write # publish the scan as a check run

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the actual PR commit rather than the merge commit, and keep full
          # history — Qodana needs it to attribute findings to changes.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
