name: Qodana

# JetBrains Qodana static analysis, reporting to qodana.cloud. Runs alongside
# golangci-lint (fast, in-CI, gating) and SonarCloud rather than replacing either —
# Qodana's inspections come from the GoLand engine, so it sees a different class of
# issue. The linter version is pinned in qodana.yaml and must track the action version
# below.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    # A pull request from a fork cannot read QODANA_TOKEN, so the scan would fail for
    # reasons the contributor cannot fix. Mirrors the HAS_NPM / HAS_SONAR pattern used
    # in the other workflows.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write # post the summary comment on a PR
      checks: write # publish the scan as a check run

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Check out the actual PR commit rather than the merge commit, and keep full
          # history — Qodana needs it to attribute findings to changes.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          pr-mode: false
          # Publish the SARIF as a build artifact. Qodana's own summary prints inspection
          # *names* ("Bool condition") but suppressions in qodana.yaml are keyed by
          # inspection *ID* (GoBoolExpressions), and the two are not derivable from each
          # other — without the SARIF the only way to find an ID is to guess and re-run.
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
