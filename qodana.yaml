version: "1.0"

# Go linter, pinned to the same release train as the qodana-action in
# .github/workflows/qodana.yml — mixing versions across the two is the usual cause of a
# scan that silently analyses nothing.
linter: jetbrains/qodana-go:2026.2

profile:
  name: qodana.recommended

# Fail the scan on any finding. Everything Qodana reported has been either fixed or
# excluded below with a stated reason, so a non-zero count now means something new — and
# a check that cannot fail is one people stop reading.
#
# This lives here rather than as a workflow input: qodana-action v2026.2 has no
# fail-threshold input (it warns "Unexpected input(s)" and carries on passing), so
# setting it there looks like a gate while being a no-op.
failThreshold: 0

exclude:
  # Generated or vendored output, plus the local build/release directories. Nothing here
  # is source we can act on, and scanning it only produces findings nobody will fix.
  - name: All
    paths:
      - dist
      - build
      - examples
      - npm/bin

  # Every entry below is a decision with a reason, matching how .golangci.yml is
  # written. A rule switched off without a stated reason is just one nobody got round
  # to fixing.

  # Section-header comments sit above package-level types and interface members
  # ("// Trivy JSON structures" over `type Report struct`), which Go's comment rules
  # then treat as doc comments. Same argument as the revive `exported` rule already
  # disabled in .golangci.yml: every package is internal/, and the module path
  # (qualflare-cli) is not a fetchable URL, so no external consumer can ever read them.
  - name: GoCommentStart

  # Diagnostics written to stderr with fmt.Fprintf, and deliberate `_ =` on best-effort
  # Close/Remove calls. golangci-lint's errcheck excludes the fmt family by default for
  # the same reason: there is no meaningful recovery from a failed write to stderr. The
  # one instance that did matter — an unchecked setup write in git_test.go — is fixed
  # rather than excluded.
  - name: GoUnhandledErrorResult

  # cmd/main_test.go asserts pointer identity: rewriteUnknownCommandError must return
  # the very same error value it was handed. errors.Is would also accept a wrapped
  # error, which is precisely the case the test exists to reject. Already carries
  # //nolint:errorlint with the same reasoning.
  - name: GoDirectComparisonOfErrors
    paths:
      - cmd/main_test.go

  # pytest and phpunit repeat junitxml's outcome switch, but their types are not
  # interchangeable: phpunit reads the failure message from the element body
  # (`xml:",chardata"`) where junitxml reads an attribute (`xml:"message,attr"`), and
  # both carry dialect-only fields (file, line, assertions, class) that
  # junitxml.TestCase has no place for. Folding them together would read the message
  # from the wrong place — a behaviour change dressed up as deduplication.
  # Two shapes of duplication, both deliberate.
  #
  # In tests: table-driven parser tests necessarily look alike — same fixture-then-assert
  # shape across a dozen packages. Factoring them into shared helpers makes a failure
  # harder to localise, which is the same reason go:S3776 is excluded for tests in
  # .golangci.yml.
  #
  # In sources: pytest and phpunit repeat junitxml's outcome switch, but their types are
  # not interchangeable — phpunit reads the failure message from the element body
  # (`xml:",chardata"`) where junitxml reads an attribute (`xml:"message,attr"`), and both
  # carry dialect-only fields junitxml.TestCase has no place for. Folding them would read
  # the message from the wrong place. xctest/maestro/espresso are three 26-line files that
  # each delegate to junitxml.Parse; collapsing them trades 60 obvious lines for one
  # clever one.
  #
  # The third path, internal/adapters/cli/command.go, is a different case with the same
  # answer. frameworkDisplayGroups there is a 27-entry lookup table that must name every
  # framework explicitly. Qodana reports "Duplicated code fragment" at its declaration
  # (command.go:820, from the check-run annotations) after detox became its 8th e2e
  # entry; the same table, one entry shorter, scans clean on main. Which fragment it
  # pairs with is not stated by the annotation and could not be reproduced locally —
  # Qodana runs only in CI here — but the likely match is the run of 8 identically
  # shaped e2e lines against the 8 unit-test lines directly above them.
  #
  # The repetition is what that table IS: one line per framework, each mapping a name to
  # one of six display buckets. Collapsing it — bucket-to-slice, or deriving it from
  # Framework.GetCategory() — is precisely the change the map's doc comment argues
  # against, because GetCategory() stopped returning bucket keys and grouping on it
  # silently dropped 23 of 24 frameworks from list-formats once already.
  # TestBuildFrameworkDisplayGroups_IncludesEveryFramework is the real guard there: it
  # fails if a framework is ever missing from the table, which is the bug worth
  # catching, and no duplication inspection would catch it.
  - name: DuplicatedCode
    paths:
      - internal/adapters/parsers
      - internal/adapters/cli/command.go

  # ctrf.Number mixes a pointer receiver (UnmarshalJSON) with value receivers
  # (IsSet/Int64/Float/String), which is what this inspection flags — once per method.
  # The mix is not a choice: encoding/json only calls UnmarshalJSON through a pointer,
  # while Number is a small immutable value read via explicit accessors on addressable
  # struct fields. time.Time in the standard library has the same shape for the same
  # reason.
  #
  # Converting the accessors to pointer receivers to satisfy the rule would cost
  # something real: Number would stop implementing fmt.Stringer, so a later
  # fmt.Sprintf("%v", n) would silently print the struct instead of the number. Scoped to
  # this package so a genuine mix anywhere else still fails the scan.
  - name: GoMixedReceiverTypes
    paths:
      - internal/adapters/parsers/generic/ctrf
