sonar.projectKey=Qualflare_qualflare-cli
sonar.organization=qualflare

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=dist/**,build/**,examples/**,npm/bin/**

# Go coverage. Produced by `go test -coverprofile=coverage.out ./...` in the CI test job,
# which is also where the scanner runs — the file must exist in the same job.
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/*_test.go,scripts/**,examples/**

# --- Rule exclusions -----------------------------------------------------------------
# Each entry below is a deliberate decision, not a convenience. Anything added here needs
# a reason in this file, so the justification is reviewable in a PR rather than buried in
# a "Won't Fix" click in the SonarCloud UI.

sonar.issue.ignore.multicriteria=e1,e2,e3

# e1 — go:S3776 (cognitive complexity) in test files.
# The parser tests are not table-driven: each is one large Test function holding a
# fixture literal followed by a long flat run of independent `if got != want` assertions.
# S3776 counts every one of those, though there is no branching logic to reason about,
# only verification. Extracting assert helpers would make failures harder to localize.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# e2 — javascript:S2612 (permissive file permission) on the npm build script.
# It chmods the released binary to 0755 (rwxr-xr-x). The published binary must be
# executable by whoever installs the package, including a root-installed global that a
# normal user then runs; no narrower mode satisfies that. No write bit is granted.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2612
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/build-npm-packages.mjs

# e3 — text:S8564 (missing lock file) on the npm wrapper package.
# npm/ is a *publishable package*, not an application. It has zero regular dependencies,
# and its optionalDependencies carry a placeholder 0.0.0 that the release pipeline
# rewrites at publish time — so a committed lock file would pin versions that do not
# exist and break `npm install` in that directory. npm never publishes a lock file.
sonar.issue.ignore.multicriteria.e3.ruleKey=text:S8564
sonar.issue.ignore.multicriteria.e3.resourceKey=npm/package.json
