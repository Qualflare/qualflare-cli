# GoReleaser configuration for Qualflare CLI
version: 2

project_name: qf

before:
  hooks:
    - go mod tidy

builds:
  - id: qf
    main: ./cmd
    binary: qf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X qualflare-cli/internal/version.Version={{.Version}}
      - -X qualflare-cli/internal/version.Commit={{.Commit}}
      - -X qualflare-cli/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Supply-chain integrity (SEC-02): a CycloneDX SBOM per archive, and a keyless
# (Sigstore/Fulcio) cosign signature over the checksums file so downloads can be
# verified. Requires syft + cosign on the runner and `id-token: write` in CI.
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

# Container images: multi-arch (amd64 + arm64) built from the root Dockerfile via
# buildx. GHCR always publishes (GITHUB_TOKEN + `packages: write`). Docker Hub only
# publishes when DOCKERHUB_TOKEN is set — mirroring the homebrew skip pattern, so a
# fork or a secret-less run still releases the binaries + GHCR image.
dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/qualflare/qf:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=qf"
      - "--label=org.opencontainers.image.description=CLI tool for collecting test results for Qualflare"
      - "--label=org.opencontainers.image.source=https://github.com/Qualflare/qualflare-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: ghcr-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/qualflare/qf:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=qf"
      - "--label=org.opencontainers.image.description=CLI tool for collecting test results for Qualflare"
      - "--label=org.opencontainers.image.source=https://github.com/Qualflare/qualflare-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: dockerhub-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    skip_push: "{{ if .Env.DOCKERHUB_TOKEN }}false{{ else }}true{{ end }}"
    image_templates:
      - "docker.io/qualflare/qf:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=qf"
      - "--label=org.opencontainers.image.description=CLI tool for collecting test results for Qualflare"
      - "--label=org.opencontainers.image.source=https://github.com/Qualflare/qualflare-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: dockerhub-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    skip_push: "{{ if .Env.DOCKERHUB_TOKEN }}false{{ else }}true{{ end }}"
    image_templates:
      - "docker.io/qualflare/qf:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=qf"
      - "--label=org.opencontainers.image.description=CLI tool for collecting test results for Qualflare"
      - "--label=org.opencontainers.image.source=https://github.com/Qualflare/qualflare-cli"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/qualflare/qf:{{ .Version }}"
    image_templates:
      - "ghcr.io/qualflare/qf:{{ .Version }}-amd64"
      - "ghcr.io/qualflare/qf:{{ .Version }}-arm64"
  - name_template: "ghcr.io/qualflare/qf:latest"
    skip_push: "{{ if .Prerelease }}true{{ else }}false{{ end }}"
    image_templates:
      - "ghcr.io/qualflare/qf:{{ .Version }}-amd64"
      - "ghcr.io/qualflare/qf:{{ .Version }}-arm64"
  - name_template: "docker.io/qualflare/qf:{{ .Version }}"
    skip_push: "{{ if .Env.DOCKERHUB_TOKEN }}false{{ else }}true{{ end }}"
    image_templates:
      - "docker.io/qualflare/qf:{{ .Version }}-amd64"
      - "docker.io/qualflare/qf:{{ .Version }}-arm64"
  - name_template: "docker.io/qualflare/qf:latest"
    skip_push: "{{ if and .Env.DOCKERHUB_TOKEN (not .Prerelease) }}false{{ else }}true{{ end }}"
    image_templates:
      - "docker.io/qualflare/qf:{{ .Version }}-amd64"
      - "docker.io/qualflare/qf:{{ .Version }}-arm64"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: Others
      order: 999

homebrew_casks:
  - name: qf
    repository:
      owner: qualflare
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/qualflare/qualflare-cli
    description: CLI tool for collecting test results for Qualflare
    license: Apache-2.0
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"

release:
  github:
    owner: qualflare
    name: qualflare-cli
  prerelease: auto
  draft: false
  name_template: "{{.ProjectName}} v{{.Version}}"
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew install qualflare/tap/qf
    ```

    ### npm (any OS, Node ≥ 16)
    ```bash
    npm install -g @qualflare/cli
    ```

    ### Docker
    ```bash
    docker run --rm ghcr.io/qualflare/qf version
    ```

    ### Binary Download
    Download the appropriate binary for your platform from the assets below.

    ## Quick Start
    ```bash
    qf login my-app YOUR_API_TOKEN
    qf my-app collect results.xml
    ```

    See `qf --help` for more options.
