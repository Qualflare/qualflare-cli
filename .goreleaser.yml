# GoReleaser configuration for Qualflare CLI
version: 2

project_name: qf

before:
  hooks:
    - go mod tidy

builds:
  - id: qf
    main: ./cmd
    binary: qf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X qualflare-cli/internal/version.Version={{.Version}}
      - -X qualflare-cli/internal/version.Commit={{.Commit}}
      - -X qualflare-cli/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: Others
      order: 999

homebrew_casks:
  - name: qf
    repository:
      owner: qualflare
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/qualflare/qualflare-cli
    description: CLI tool for collecting test results for Qualflare
    license: Apache-2.0
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"

release:
  github:
    owner: qualflare
    name: qualflare-cli
  prerelease: auto
  draft: false
  name_template: "{{.ProjectName}} v{{.Version}}"
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew install qualflare/tap/qf
    ```

    ### Binary Download
    Download the appropriate binary for your platform from the assets below.

    ## Quick Start
    ```bash
    qf login my-app YOUR_API_TOKEN
    qf my-app collect results.xml
    ```

    See `qf --help` for more options.
